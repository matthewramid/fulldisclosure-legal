<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legal — Full Disclosure</title>
<meta name="description" content="Legal information for the Full Disclosure app, operated by House of MaRa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@500;600&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FAF7F2;
    --ink:#1A1A1A;
    --ink-soft:#4A4A46;
    --oxblood:#8B2635;
    --rule:rgba(26,26,26,0.12);
    --card:rgba(26,26,26,0.02);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--cream);
    color:var(--ink);
    font-family:"Inter Tight",system-ui,-apple-system,sans-serif;
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .wrap{max-width:560px;width:100%;padding:56px 24px 72px;}
  .brand{
    font-family:"Brygada 1918",Georgia,serif;
    font-weight:600;
    font-size:17px;
    letter-spacing:.02em;
  }
  .brand .dot{color:var(--oxblood);}
  h1{
    font-family:"Brygada 1918",Georgia,serif;
    font-weight:600;
    font-size:42px;
    line-height:1.1;
    margin:24px 0 10px;
    letter-spacing:-0.01em;
  }
  .sub{color:var(--ink-soft);margin:0 0 40px;}
  .links{display:flex;flex-direction:column;gap:12px;}
  a.card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px;
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:12px;
    text-decoration:none;
    color:var(--ink);
    transition:background .15s ease, border-color .15s ease;
  }
  a.card:hover{background:rgba(139,38,53,0.04);border-color:rgba(139,38,53,0.3);}
  a.card .label{
    font-family:"Brygada 1918",Georgia,serif;
    font-weight:600;
    font-size:19px;
  }
  a.card .arrow{color:var(--oxblood);font-size:20px;}
  .foot{
    margin-top:48px;
    font-family:"JetBrains Mono",ui-monospace,monospace;
    font-size:12px;
    letter-spacing:.03em;
    color:var(--ink-soft);
  }
  .foot a{color:var(--ink-soft);}
  @media (max-width:520px){
    .wrap{padding:40px 20px 56px;}
    h1{font-size:34px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Full Disclosure<span class="dot">.</span></div>
  <h1>Legal</h1>
  <p class="sub">Policies for the Full Disclosure app, operated by House of MaRa.</p>
  <div class="links">
    <a class="card" href="/privacy.html">
      <span class="label">Privacy Policy</span>
      <span class="arrow">&rarr;</span>
    </a>
    <a class="card" href="/terms.html">
      <span class="label">Terms of Use</span>
      <span class="arrow">&rarr;</span>
    </a>
  </div>
  <div class="foot">
    Questions? <a href="mailto:support@fulldisclosureapp.com">support@fulldisclosureapp.com</a>
  </div>
</div>
</body>
</html>
